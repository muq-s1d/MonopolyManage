# Free Supabase projects pause after 7 days without database activity.
# Reading the one keepalive row once a day counts as activity.
name: Keep the session service awake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "$SUPABASE_URL/rest/v1/keepalive?select=id" -H "apikey: $SUPABASE_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
